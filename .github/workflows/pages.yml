# Pubblica dist/ots.html su GitHub Pages.
#
# Non e' un vezzo: Safari su iPhone non concede la camera a una pagina aperta
# da file locale, serve un contesto sicuro. Con la pagina servita in HTTPS la
# camera funziona, e una volta caricata la pagina non usa piu' la rete.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Costruisci dai sorgenti
        run: node build.mjs

      - name: Prepara il sito
        run: |
          mkdir -p _site
          cp dist/ots.html _site/index.html
          cp dist/ots.html _site/ots.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
