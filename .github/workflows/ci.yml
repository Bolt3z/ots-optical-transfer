name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Un limite esplicito: senza, uno step appeso brucia sei ore di runner.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-audit --no-fund

      # Con ffmpeg il test in browser copre anche i video veri (.mp4 e .mov), che
      # e' il percorso usato su iPhone. Senza, li salta e prova comunque la via
      # d'errore. E' best effort e limitato nel tempo perche' su questo runner
      # `apt-get install ffmpeg` una volta e' rimasto appeso oltre 11 minuti.
      - name: ffmpeg (facoltativo, per i video veri)
        continue-on-error: true
        timeout-minutes: 4
        run: sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Costruisci il bundle
        run: node build.mjs

      # dist/ots.html e' il prodotto e sta nel repo: se non corrisponde ai
      # sorgenti, chi lo scarica usa una versione diversa da quella provata.
      - name: dist/ots.html corrisponde ai sorgenti
        run: git diff --exit-code -- dist/ots.html

      - name: Test del protocollo
        run: node test/core.test.mjs

      - name: Test della catena completa
        run: node test/e2e.test.mjs

      - name: Test in browser reale (canvas, camera finta, worker)
        run: node test/browser.test.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
